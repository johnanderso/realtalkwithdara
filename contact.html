<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · RealTalkWithDara</title>
<meta name="description" content="Get in touch with RealTalkWithDara.">

<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/index.html" class="logo">
      <img data-setting-src="logo" src="/images/logo.jpg" alt="RealTalkWithDara">
    </a>
    <nav class="nav-links" id="nav-links">
      <a href="/index.html">Home</a>
      <a href="/about.html">About</a>
      <a href="/journals/index.html">Journals</a>
      <a href="/contact.html" aria-current="page">Contact</a>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="page-header">
  <div class="container">
    <span class="eyebrow"></span>
    <h1>Let&rsquo;s talk</h1>
    <p class="lede"></p>
  </div>
</section>

<section class="section">
  <div class="container contact-grid">
    <div class="contact-form">
      <div class="form-status" id="form-status">Thank you — your message is on its way. I&rsquo;ll get back to you soon.</div>
      <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="contact-form">
        <input type="hidden" name="form-name" value="contact">
        <p style="display:none">
          <label>Don&rsquo;t fill this out: <input name="bot-field"></label>
        </p>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send message</button>
      </form>
    </div>

    <aside class="contact-info">
      <div class="avatar">
        <img src="/images/dara-portrait-black.jpg" alt="Portrait of Dara">
      </div>
      <h3>Find me here too</h3>
      <p></p>

      <div class="info-line">
        <div>
          <strong>Email</strong>
          <span data-setting="contact_email"></span>
        </div>
      </div>
      <div class="info-line">
        <div>
          <strong>Response time</strong>
          <span data-setting="contact_response_time"></span>
        </div>
      </div>

      <div class="socials">
        <a href="#" data-setting-href="instagram_url" aria-label="Instagram">
          <svg viewBox="0 0 448 512"><path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/></svg>
        </a>
        <a href="#" data-setting-href="threads_url" aria-label="Threads">
          <svg viewBox="0 0 24 24"><path d="M12.2 2.5c-4.8 0-7.7 2.9-7.7 7.1 0 3.6 2.1 5.9 5.1 6.9-.2 1.8-1.3 3.1-3.1 3.7a.8.8 0 00.3 1.6c3.4-.6 5.4-2.6 5.9-5.5.3 0 .6.1.9.1 4.9 0 7.9-3 7.9-7.4 0-4.3-2.9-6.5-9.3-6.5zm.2 2c4.9 0 6.9 1.5 6.9 4.5 0 3.1-2.1 5.4-5.9 5.4-.5 0-1-.1-1.5-.2a.85.85 0 00-1 .7c-.2 1.2-.7 2.2-1.6 3 .2-.6.3-1.3.3-2a.85.85 0 00-.6-.8c-2.5-.8-3.9-2.4-3.9-4.9 0-3.2 2.2-5.7 7.3-5.7z"/></svg>
        </a>
      </div>
    </aside>
  </div>
</section>

    <span class="copyright">&copy; <span data-year></span> RealTalkWithDara. All words are Dara&rsquo;s own.</span>

<script src="/js/main.js"></script>
<script>
  var form = document.getElementById("contact-form");
  var status = document.getElementById("form-status");
  if (form) {
    form.addEventListener("submit", function (e) {
      var data = new FormData(form);
      e.preventDefault();
      fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(data).toString()
      }).then(function () {
        status.classList.add("success");
        form.reset();
      }).catch(function () {
        form.submit();
      });
    });
  }
</script>
</body>
</html>
